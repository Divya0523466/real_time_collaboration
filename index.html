<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="./src/assets/worknestlogo.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>WorkNest - Real-Time Collaboration Platform</title>
    <meta name="description" content="WorkNest is a modern, real-time collaboration platform featuring instant messaging, team workspaces, and live notifications." />
    <!-- Defer Font Awesome to prevent render blocking -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css" media="print" onload="this.media='all'" />
    <noscript><link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css" /></noscript>
    <script>
      (function() {
        try {
          const theme = localStorage.getItem('worknest_theme');
          if (theme === 'dark') {
            document.documentElement.classList.add('dark');
          } else {
            document.documentElement.classList.remove('dark');
          }
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
